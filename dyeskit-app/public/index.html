<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DYESKIT — Village Well-Being Platform</title>
<meta name="description" content="Project DYESKIT: village well-being data collection, scoring and insights for Ladakh.">
<link rel="icon" href="images/logo-placeholder.svg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#17605b" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151b1a" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DYESKIT">
<link rel="apple-touch-icon" href="images/icon-180.png">
<link rel="stylesheet" href="css/theme.css">
</head>
<body>
  <div id="root">
    <div class="login-wrap"><div class="spinner" aria-label="Loading"></div></div>
  </div>
  <script type="module" src="js/app.js"></script>
  <script>
    // Installable app shell. Registered last so it can never block the first paint.
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
