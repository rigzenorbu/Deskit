# Production deployment on Render (render.com): New + → Blueprint → choose the repository, and
# set the Blueprint path to dyeskit-platform/render.yaml (the render.yaml at the repository root
# is the free demo).
#
# Creates:
#   • dyeskit-live — the API server, which also serves the web version of the app
#
# The database is Supabase in Mumbai (ap-south-1), so household data is stored in India.
# Render has no India region yet; the server runs in Singapore and keeps no data of its own.
# When Render asks for the secret settings (sync: false below), fill in:
#   DATABASE_URL     Supabase → Connect → Session pooler (port 5432), with your database password
#   ADMIN_EMAIL / ADMIN_PASSWORD   the first admin account, created on the first start
#   FAST2SMS_API_KEY, OTP_SECRET   text-message codes (see docs/DEPLOYMENT.md)

services:
  - type: web
    name: dyeskit-live
    runtime: node
    plan: free           # starter (about US$7/month) never sleeps; free is kept awake by a ping every 10 minutes
    region: singapore
    rootDir: dyeskit-platform
    buildCommand: npm ci && npm run build:web
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SEED_DEMO
        value: "false"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMS_PROVIDER
        value: fast2sms
      - key: FAST2SMS_ROUTE
        value: quick
      - key: FAST2SMS_API_KEY
        sync: false
      - key: OTP_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY      # optional: AI answers in "Ask the data"
        sync: false
